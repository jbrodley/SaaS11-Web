baseURL = "https://www.saas11.com/"
title = "SaaS 11"

[languages]
  [languages.en]
    label = "English"
    locale = "en-US"
    weight = 1
enableRobotsTXT = true
enableGitInfo = false

# Pagination for the blog/insights list
[pagination]
  pagerSize = 9

[params]
  description = "SaaS 11 assembles the specialists your transformation demands — across technology, organization, and leadership — to help software companies deliver outcomes, not just tools."
  # Brand
  brandName = "SaaS 11"
  # Header call-to-action button
  navCtaText = "Start a conversation"
  navCtaUrl = "/#contact"
  # Contact + social (used in footer)
  contactEmail = ""      # Removed to avoid spam — contact form is the only channel
  footerBlurb = "The assembled team for the AI era — technology, organization, and leadership specialists who build, operate, and transfer so you own the result."

  [params.social]
    linkedin = ""
    x = ""
    github = ""

  # Forms — using a hosted handler (no backend to run).
  #
  # Formspree:  create a form, then set the endpoint below, e.g.
  #             contactAction = "https://formspree.io/f/abcdwxyz"
  #             (You can use one form for both, or two separate endpoints.)
  #
  # Web3Forms:  set web3formsKey to your access key and point the actions at
  #             https://api.web3forms.com/submit (the key is injected as a
  #             hidden field automatically).
  [params.forms]
    contactAction = "https://formspree.io/f/xwvjaavj"
    newsletterAction = "https://formspree.io/f/xbdeqqgn"
    web3formsKey = ""       # only for Web3Forms; leave blank for Formspree
    # Cloudflare Turnstile site key (required when Formspree captcha is enabled).
    # Get yours at: https://dash.cloudflare.com/?to=/:account/turnstile
    # Or check Formspree form Settings → Spam Protection for the key.
    turnstileSiteKey = "0x4AAAAAADkq5mFz6VYoVzQ4"
    # Where the handler redirects on success for the no-JS fallback.
    successUrl = "/thanks/"

# Primary navigation
[[menus.main]]
  name = "Capabilities"
  url = "/capabilities/"
  weight = 10
[[menus.main]]
  name = "About"
  url = "/about/"
  weight = 15
[[menus.main]]
  name = "Point of view"
  url = "/#thesis"
  weight = 20
[[menus.main]]
  name = "Approach"
  url = "/#approach"
  weight = 30
[[menus.main]]
  name = "Insights"
  url = "/insights/"
  weight = 40
[[menus.main]]
  name = "Contact"
  url = "/#contact"
  weight = 50

# Footer "Company" column
[[menus.footer]]
  name = "Capabilities"
  url = "/capabilities/"
  weight = 10
[[menus.footer]]
  name = "Insights"
  url = "/insights/"
  weight = 20
[[menus.footer]]
  name = "Contact"
  url = "/#contact"
  weight = 30

[markup]
  [markup.goldmark.renderer]
    unsafe = true
  [markup.highlight]
    noClasses = false
    style = "github-dark"

[outputs]
  home = ["HTML", "RSS"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  filename = "sitemap.xml"
  priority = 0.5

[taxonomies]
  tag = "tags"
  category = "categories"
